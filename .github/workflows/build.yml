name: Build Lexora Service

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'build-diagnostics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Assemble debug APK
        id: assemble
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-diagnostics/ci
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-diagnostics/ci/assemble-debug.log

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics/ci
          {
            echo "Lexora Service CI build diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Job status: ${{ job.status }}"
            echo "Version: 0.28.0"
            echo "VersionCode: 28"
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-diagnostics/ci/summary.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexora-service-build-diagnostics-${{ github.run_number }}
          path: build-diagnostics/ci/
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "Verified APK: $APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lexora-service-0.28.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
