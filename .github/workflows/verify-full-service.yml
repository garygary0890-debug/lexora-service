name: Verify Full Service Completion

on:
  push:
    branches:
      - feature/full-service-completion-20260920
  workflow_dispatch:

concurrency:
  group: lexora-service-full-completion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Run core unit tests
        run: gradle --no-daemon --stacktrace :core:domain:testDebugUnitTest :core:data:testDebugUnitTest :core:database:testDebugUnitTest
      - name: Run feature unit tests
        run: gradle --no-daemon --stacktrace :feature:notifications:testDebugUnitTest :feature:reports:testDebugUnitTest :feature:wash:testDebugUnitTest :feature:tires:testDebugUnitTest
      - name: Run app unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lexora-service-full-completion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
